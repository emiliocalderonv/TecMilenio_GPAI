# =============================================================================
# OVARA · demo local: orquesta los dos contenedores (backend + frontend)
#
# Ejecución (desde esta carpeta):
#   0) Todo en un paso:      iniciar_demo.bat   (Windows)  |  ./iniciar_demo.sh (Linux/macOS)
#   1) Pesos del modelo:     python scripts/descargar_modelos.py      (solo la primera vez)
#   2) Construir y encender: docker compose up --build -d
#   3) Abrir:                http://localhost:3000        (API: http://localhost:8000/docs)
#   4) Ver bitácoras:        docker compose logs -f backend
#   5) Detener:              docker compose down
# Sin pesos (solo para probar la integración):  OVARA_MODO_PRUEBA=1 docker compose up --build
# Puertos y opciones: copiar .env.example a .env
# =============================================================================
services:
  backend:
    build: ./backend
    image: ovara-backend:1.0.0
    container_name: ovara-backend
    environment:
      OVARA_MODELOS: /modelos
      OVARA_MODO_PRUEBA: ${OVARA_MODO_PRUEBA:-0}   # 1 = pesos aleatorios (solo para probar la integración)
      OVARA_HILOS: ${OVARA_HILOS:-0}               # 0 = todos los núcleos
    volumes:
      - ./modelos:/modelos:ro
    ports:
      - "${PUERTO_API:-8000}:8000"                 # API y documentación en http://localhost:8000/docs
    restart: unless-stopped

  frontend:
    build: ./frontend
    image: ovara-frontend:1.0.0
    container_name: ovara-frontend
    environment:
      BACKEND_URL: http://backend:8000
      EJEMPLOS_DIR: /ejemplos
      PORT: 3000
    volumes:
      - ./ejemplos:/ejemplos:ro
    ports:
      - "${PUERTO:-3000}:3000"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
